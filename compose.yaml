services:
  mongodb:
    image: mongo:7
    container_name: app-asset-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: app_asset_service
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: app-asset-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: app-asset-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/frontend-assets;
      "

  app-asset-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-asset-service
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      ADDR: :8080
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: app_asset_service
      MONGO_COLLECTION: app_asset_releases
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: frontend-assets
      MINIO_USE_SSL: "false"
      RELEASE_TOKENS: local-dev-token
    ports:
      - "8080:8080"
